name: keycase
description: "Local-first offline password manager and TOTP authenticator."
publish_to: 'none'

# Android: build-name -> versionName, build-number -> versionCode。
# versionCode 必须单调递增；发版脚本负责 +1，系统升级安装依赖它。
version: 1.0.3+8
environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 日期/时间格式化统一走 intl，不手拼用户可见日期。
  intl: ^0.20.3
  # 内置 Aegis 图标包是 SVG；渲染入口只有 lib/app/icons/ 一处。
  flutter_svg: ^2.3.2
  # 锚点菜单统一使用外部组件库，应用只负责把设计令牌桥接到 ThemeExtension。
  anchored_menu: ^0.1.3
  # 二维码扫描（添加令牌）。相机权限只在进入扫描页时申请。
  mobile_scanner: ^7.5.0
  # 生物识别快捷解锁；系统弹窗文案使用 local_auth_android 的中文资源。
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  # 设备偏好（主题、语言、自动锁定等）；绝不存放保险库数据。
  shared_preferences: ^2.5.6
  # 应用私有目录：保险库文件与图标包缓存。
  path_provider: ^2.1.6
  # 保险库/备份的路径拼接，不手写分隔符。
  path: ^1.9.0
  # 备份导出/导入使用系统文档选择器（SAF）。
  file_selector: ^1.1.0
  # 容器正文的 gzip 编解码（vault_container 使用）。
  archive: ^4.6.0
  # TOTP/HOTP/Steam 的 HMAC 实现。
  crypto: ^3.0.8
  # Argon2id 与 AES-256-GCM 的纯 Dart 实现，测试与运行时共用。
  cryptography: ^2.9.0
  # 打开条目里的网址，只走系统默认浏览器。
  url_launcher: ^6.3.3
  pointycastle: ^4.0.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # lint 基线：flutter_lints + 一组偏正确性的规则。
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 由 lib/l10n/*.arb 生成本地化代码（见 l10n.yaml）。
  generate: true

  assets:
    # Aegis 图标包：目录声明不递归，必须把 SVG 子目录单独列出。
    - assets/iconpacks/aegis-simple-icons-v269/pack.json
    - assets/iconpacks/aegis-simple-icons-v269/SVG/
