name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- '*.dart'
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Dart 层测试不会编译 android/ 下的 Kotlin；这里额外构建一次 debug APK，
      # 提前拦住 MethodChannel、Manifest 与签名配置错误。
      - name: Build debug APK
        run: flutter build apk --debug
