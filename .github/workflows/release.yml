name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    env:
      KEYCASE_KEYSTORE_PATH: ${{ github.workspace }}/.keycase-release.jks
      KEYCASE_STORE_PASSWORD: ${{ secrets.KEYCASE_STORE_PASSWORD }}
      KEYCASE_KEY_ALIAS: ${{ secrets.KEYCASE_KEY_ALIAS }}
      KEYCASE_KEY_PASSWORD: ${{ secrets.KEYCASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYCASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYCASE_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYCASE_KEYSTORE_PATH"

      - name: Build signed release APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease --no-configuration-cache

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${GITHUB_REF_NAME}"
          previous=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${current}$" \
            | head -n 1)
          if [ -n "$previous" ]; then
            notes="https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${current}"
          else
            notes="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${current}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "KeyCase-${current}.apk"
          gh release create "$current" "KeyCase-${current}.apk" \
            --title "$current" \
            --notes "$notes"
