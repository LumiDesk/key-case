name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      # 签名材料入库在 signing/ 下；构建脚本直接读取，
      # 不要把密码写进工作流日志。
      # 只出 arm64：所有现役 Android 手机都是 64 位，单 ABI 能把包从 70MB 级压到 20MB 级。
      - name: Build signed release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "keycase-${GITHUB_REF_NAME}.apk"
          sha256sum "keycase-${GITHUB_REF_NAME}.apk" \
             > "keycase-${GITHUB_REF_NAME}.apk.sha256"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "keycase-${GITHUB_REF_NAME}.apk" \
            "keycase-${GITHUB_REF_NAME}.apk.sha256" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --notes "KeyCase $GITHUB_REF_NAME — 安装前请先导出一份备份。"
