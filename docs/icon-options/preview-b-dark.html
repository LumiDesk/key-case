<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0A08; color: #F3EAD9; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { display: flex; gap: 34px; padding: 32px 40px; width: 1000px; }
  .item { width: 280px; text-align: center; }
  .art { width: 224px; height: 224px; margin: 0 auto 16px; border-radius: 50px; overflow: hidden; box-shadow: 0 20px 48px rgba(0,0,0,.55); }
  .art img { width: 100%; height: 100%; display: block; }
  .name { font-size: 19px; font-weight: 700; }
  .desc { font-size: 12px; color: #A99A84; margin-top: 6px; line-height: 1.55; }
  .badge { display: inline-block; margin-top: 9px; font-size: 11px; color: #D6B27A; border: 1px solid #4B3A27; border-radius: 999px; padding: 3px 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item">
      <div class="art"><img src="b1-midnight-ivory.svg"></div>
      <div class="name">B1 · 墨夜象牙</div>
      <div class="desc">暖黑底 + 象牙钥匙 + 一点黄铜<br>最接近 B，但更克制</div>
      <div class="badge">推荐</div>
    </div>
    <div class="item">
      <div class="art"><img src="b2-espresso-brass.svg"></div>
      <div class="name">B2 · 深咖黄铜</div>
      <div class="desc">深咖底 + 黄铜圆环<br>更暖、更有质感</div>
    </div>
    <div class="item">
      <div class="art"><img src="b3-obsidian.svg"></div>
      <div class="name">B3 · 黑曜极简</div>
      <div class="desc">纯黑底 + 象牙钥匙<br>无装饰，最简洁</div>
    </div>
  </div>
</body>
</html>
