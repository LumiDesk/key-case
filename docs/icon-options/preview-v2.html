<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14120F; color: #F2EADF; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { display: flex; gap: 28px; padding: 30px 34px; width: 1200px; }
  .item { width: 258px; text-align: center; }
  .art { width: 214px; height: 214px; margin: 0 auto 15px; border-radius: 48px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.45); }
  .art img { width: 100%; height: 100%; display: block; }
  .name { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .desc { font-size: 12px; color: #A89B89; margin-top: 5px; line-height: 1.5; }
  .badge { display: inline-block; margin-top: 9px; font-size: 11px; color: #D9B77C; border: 1px solid #4A3B2A; border-radius: 999px; padding: 3px 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item">
      <div class="art"><img src="option-a-noir.svg"></div>
      <div class="name">A · 黑金钥匙孔</div>
      <div class="desc">暖黑 + 香槟金圆环<br>克制、偏高端</div>
      <div class="badge">推荐</div>
    </div>
    <div class="item">
      <div class="art"><img src="option-b-ivory.svg"></div>
      <div class="name">B · 象牙与墨</div>
      <div class="desc">暖白纸感 + 墨色钥匙<br>清爽、辨识度高</div>
    </div>
    <div class="item">
      <div class="art"><img src="option-c-forest.svg"></div>
      <div class="name">C · 森林钥匙孔</div>
      <div class="desc">深绿 + 黄铜光感<br>比上一版 C 更精致</div>
    </div>
    <div class="item">
      <div class="art"><img src="option-d-clay.svg"></div>
      <div class="name">D · 陶土盾牌</div>
      <div class="desc">陶土红 + 米白盾牌<br>温暖、有安全感</div>
    </div>
  </div>
</body>
</html>
