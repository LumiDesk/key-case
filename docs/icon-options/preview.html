<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1220; color: #e5eef9; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { display: flex; gap: 26px; padding: 28px 32px; width: 1200px; }
  .item { width: 260px; text-align: center; }
  .art { width: 216px; height: 216px; margin: 0 auto 14px; border-radius: 48px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.32); }
  .art img { width: 100%; height: 100%; display: block; }
  .name { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .desc { font-size: 12px; color: #93a4bb; margin-top: 4px; line-height: 1.45; }
  .badge { display: inline-block; margin-top: 8px; font-size: 11px; color: #7dd3fc; border: 1px solid #1e3a5f; border-radius: 999px; padding: 3px 9px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item">
      <div class="art"><img src="option-a-shield-key.svg"></div>
      <div class="name">A · 盾牌钥匙</div>
      <div class="desc">盾牌 + 钥匙孔<br>安全感最强，最像密码管理器</div>
      <div class="badge">推荐</div>
    </div>
    <div class="item">
      <div class="art"><img src="option-b-key-cut.svg"></div>
      <div class="name">B · 斜置钥匙</div>
      <div class="desc">渐变蓝 + 琥珀点<br>更轻快、现代</div>
    </div>
    <div class="item">
      <div class="art"><img src="option-c-keyhole.svg"></div>
      <div class="name">C · 深色钥匙孔</div>
      <div class="desc">深色底 + 光环<br>偏高端、极简</div>
    </div>
    <div class="item">
      <div class="art"><img src="option-d-light-key.svg"></div>
      <div class="name">D · 浅色钥匙</div>
      <div class="desc">浅蓝底 + 蓝色钥匙<br>更清爽，但深色桌面上较亮</div>
    </div>
  </div>
</body>
</html>
